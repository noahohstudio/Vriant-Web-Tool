<!doctype html>
<html lang="en" data-theme="signature">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Vriant turns this week's homework into next week's practice." />
    <title>Vriant — homework in, practice out</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath d='M3 17H17V3Z' fill='%231C1B19' stroke='%231C1B19' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before first paint so there is never a flash of the wrong theme.
      // The loading screen shows once per session; reloads go straight to the app.
      try {
        var t = localStorage.getItem('vriant:theme');
        if (t === 'signature' || t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        if (sessionStorage.getItem('vriant:splash')) document.documentElement.classList.add('splash-seen');
      } catch (e) {}
      // Never leave anyone on the loading screen: if the app can't start (its script fails to load, or nothing has
      // started after 15 s), the loading screen says so and offers a reload. main.tsx clears this once it renders.
      window.vriantFail = function (why) {
        if (window.vriantStarted) return;
        var el = document.getElementById('splash');
        if (!el) return;
        document.documentElement.classList.remove('splash-seen');
        el.classList.add('is-ready', 'is-failed');
        var msg = document.getElementById('splash-why');
        if (msg && why) msg.textContent = why;
      };
      window.vriantBoot = setTimeout(function () {
        window.vriantFail('It’s taking much longer than it should. Check your connection, then reload.');
      }, 15000);
      window.addEventListener(
        'error',
        function (e) {
          var t = e.target;
          if (t && t.tagName === 'SCRIPT') window.vriantFail('Part of Vriant didn’t download. Check your connection, then reload.');
        },
        true,
      );
    </script>
    <style>
      /* Loading screen. Inline, so it paints before any script or stylesheet loads; colours mirror tokens.css. */
      .splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #ece5d8; color: #1c1b19; --rule: rgba(28, 27, 25, 0.12); --node: rgba(28, 27, 25, 0.4); --sub: #6a604f; transition: opacity 320ms cubic-bezier(0.45, 0, 0.2, 1); }
      html[data-theme='light'] .splash { background: #fbfaf8; --sub: #5d5a54; }
      html[data-theme='dark'] .splash { background: #151413; color: #ece5d8; --rule: rgba(236, 229, 216, 0.1); --node: rgba(236, 229, 216, 0.4); --sub: #a09c94; }
      html.splash-seen .splash { display: none; }
      .splash.is-leaving { opacity: 0; pointer-events: none; }
      .splash__inner { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .splash__brand, .splash__tag { opacity: 0; transform: translateY(4px); transition: opacity 280ms cubic-bezier(0.2, 0.7, 0.2, 1), transform 280ms cubic-bezier(0.2, 0.7, 0.2, 1); }
      .splash__tag { transition-delay: 80ms; }
      .splash.is-ready .splash__brand, .splash.is-ready .splash__tag { opacity: 1; transform: none; }
      .splash__brand { display: flex; align-items: baseline; gap: 12px; }
      .splash__mark { width: 27px; height: 27px; flex: none; }
      .splash__word { font: 600 40px/1 'Geist Variable', 'Geist', ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.04em; }
      .splash__tag { margin: 0; color: var(--sub); font: 400 15px/24px 'Geist Variable', 'Geist', ui-sans-serif, system-ui, sans-serif; }
      /* A construction line with a node at each end; a graphite segment sweeps along it (transform only). */
      .splash__line { position: relative; width: 208px; height: 11px; margin-top: 14px; }
      .splash__line::before, .splash__line::after { content: ''; position: absolute; top: 0; width: 11px; height: 11px; background: linear-gradient(var(--node), var(--node)) center / 1px 100% no-repeat, linear-gradient(var(--node), var(--node)) center / 100% 1px no-repeat; }
      .splash__line::before { left: 0; }
      .splash__line::after { right: 0; }
      .splash__rule { position: absolute; top: 5px; left: 5px; right: 5px; height: 1px; overflow: hidden; background: var(--rule); }
      .splash__rule i { position: absolute; top: 0; left: 0; width: 36%; height: 1px; background: currentColor; transform: translateX(-100%); animation: splash-sweep 1.5s cubic-bezier(0.45, 0.05, 0.35, 1) infinite; }
      @keyframes splash-sweep { to { transform: translateX(280%); } }
      /* If the app can't start, the line stops and a short message with a reload takes the tagline's place. */
      .splash__fail { display: none; flex-direction: column; align-items: center; gap: 14px; max-width: 320px; text-align: center; font: 400 15px/24px 'Geist Variable', 'Geist', ui-sans-serif, system-ui, sans-serif; }
      .splash__fail p { margin: 0; }
      .splash__fail p:first-child { font-weight: 600; }
      .splash__fail p + p { color: var(--sub); }
      .splash__fail button { height: 40px; margin-top: 6px; padding: 0 20px; border: 0; border-radius: 999px; background: #1c1b19; color: #ece5d8; font: 500 14px/20px 'Geist Variable', 'Geist', ui-sans-serif, system-ui, sans-serif; cursor: pointer; }
      html[data-theme='light'] .splash__fail button { color: #fbfaf8; }
      html[data-theme='dark'] .splash__fail button { background: #ece5d8; color: #151413; }
      .splash__fail button:focus-visible { outline: 2px solid #3348d4; outline-offset: 2px; }
      .splash.is-failed .splash__tag, .splash.is-failed .splash__line { display: none; }
      .splash.is-failed .splash__fail { display: flex; }
      @media (prefers-reduced-motion: reduce) {
        .splash__rule i { animation: none; transform: none; width: 100%; opacity: 0.35; }
        .splash, .splash__brand, .splash__tag { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="splash" id="splash">
      <div class="splash__inner">
        <div class="splash__brand">
          <svg class="splash__mark" viewBox="0 0 20 20"><path d="M3 17H17V3Z" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round" /></svg>
          <span class="splash__word">vriant</span>
        </div>
        <p class="splash__tag">Homework in, practice out.</p>
        <div class="splash__line"><div class="splash__rule"><i></i></div></div>
        <div class="splash__fail" role="alert">
          <p>Vriant didn’t finish loading.</p>
          <p id="splash-why">Check your connection, then reload.</p>
          <button type="button" onclick="location.reload()">Reload</button>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script nomodule>
      window.vriantFail('This browser is too old to run Vriant. Try a current Chrome, Safari, Firefox or Edge.');
    </script>
  </body>
</html>
