<!doctype html>
<html lang="en" data-theme="signature">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Vriant turns this week's homework into next week's practice." />
    <title>Vriant — homework in, practice out</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath d='M3 17H17V3Z' fill='%231C1B19' stroke='%231C1B19' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before first paint so there is never a flash of the wrong theme.
      try {
        var t = localStorage.getItem('vriant:theme');
        if (t === 'signature' || t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
